name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Import smoke test
        run: uv run python -c "import research_agent, agent"

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deep-agents-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npx -y yarn@1.22.22 install --frozen-lockfile
      - name: Build
        run: npx -y yarn@1.22.22 build
